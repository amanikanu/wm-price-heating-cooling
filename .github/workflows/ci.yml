name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ALLOW_TEST_BOOKINGS: 'true'
      BOOKING_RATE_LIMIT: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:content
      - run: npm run check:seo
      - run: npm run check:redirects
      - run: npm run check:links
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Lighthouse CI
        run: |
          npm run start &
          npx --yes wait-on http://127.0.0.1:3000
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx --yes @lhci/cli autorun --config=./lighthouserc.json
